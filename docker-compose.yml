services:
  copilot-api:
    build:
      context: .
      network: "${COPILOT_BUILD_NETWORK:-default}"
      args:
        # Override with COPILOT_PIP_INDEX_URL for a mirror or internal index.
        PIP_INDEX_URL: "${COPILOT_PIP_INDEX_URL:-https://pypi.org/simple}"
        PIP_DEFAULT_TIMEOUT: "${COPILOT_PIP_TIMEOUT:-60}"
        PIP_RETRIES: "${COPILOT_PIP_RETRIES:-3}"
    image: windows-copilot-api
    ports:
      - "8000:8000"
    environment:
      # Bind inside the container; the host port is set under `ports` above.
      HOST: "0.0.0.0"
      PORT: "8000"
      # Self-imposed rate limit (see server/config.py). Tune to your account.
      RATE_LIMIT_RPM: "12"
      RATE_LIMIT_BURST: "4"
      # If substrate.office.com is unreachable from this host, route through a proxy:
      # e.g. COPILOT_PROXY=http://192.168.1.x:7890 docker compose up -d (or put it in .env)
      COPILOT_PROXY: "${COPILOT_PROXY:-}"
    volumes:
      # Persist the signed-in browser profile + cached token across restarts.
      # Sign in once on the host (`python -m copilot login`) so this folder is
      # populated; the container only does the headless token refresh.
      - ./session:/app/session
    restart: unless-stopped
